<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>明亮绘本场景压力测试</title>
  <style>
    @font-face {
      font-family: "Noto Sans CJK SC";
      src: url("../../../../sc/Assets/Art/Fonts/NotoSansCJKsc-Regular.otf");
    }

    :root {
      color-scheme: light;
      --ink: #3a2b1f;
      --muted: #6f6256;
      --paper: rgba(250, 245, 233, .91);
      --line: rgba(113, 83, 50, .24);
      --sage: #cfddd8;
      --blue: #315e6a;
      --green: #527c59;
      --red: #a34d3f;
      font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 5% 0%, rgba(255,255,255,.82), transparent 32rem),
        var(--sage);
    }

    button { font: inherit; }

    main {
      width: min(1480px, calc(100% - 40px));
      margin: 0 auto;
      padding: 26px 0 38px;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 5px;
      font-size: 28px;
      font-weight: 650;
    }

    header p, .meta, .caption {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      flex-wrap: wrap;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--paper);
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .control-label {
      color: var(--muted);
      font-size: 12px;
    }

    .segmented {
      display: flex;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: rgba(223, 213, 193, .72);
    }

    .segmented button {
      padding: 7px 14px;
      color: var(--muted);
      border: 0;
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
    }

    .segmented button[aria-pressed="true"] {
      color: var(--ink);
      background: #fffdf7;
      box-shadow: 0 2px 8px rgba(67, 48, 30, .12);
    }

    #cropControls[hidden] { display: none; }

    .viewer {
      margin-top: 16px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #e7dfcd;
      box-shadow: 0 16px 45px rgba(65, 48, 34, .12);
    }

    .viewer img {
      display: block;
      width: 100%;
      height: auto;
    }

    .result-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .result {
      min-height: 74px;
      padding: 13px 15px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--paper);
    }

    .result span {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .result strong {
      font-size: 15px;
      font-weight: 600;
    }

    .pass { color: var(--green); }
    .warn { color: var(--red); }
    .caption { margin-top: 12px; line-height: 1.6; }

    @media (max-width: 820px) {
      main { width: min(100% - 20px, 1480px); padding-top: 16px; }
      header { align-items: flex-start; flex-direction: column; }
      .toolbar { align-items: flex-start; flex-direction: column; }
      .result-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>明亮绘本场景压力测试</h1>
        <p>正式卡池 v0.3.2 · 商店与战斗 · 1920×1080</p>
      </div>
      <span class="meta">无需 Unity · 离线评审</span>
    </header>

    <section class="toolbar" aria-label="场景控制">
      <div class="control-group">
        <span class="control-label">场景</span>
        <div class="segmented" id="sceneControls">
          <button type="button" data-scene="shop" aria-pressed="true">商店</button>
          <button type="button" data-scene="battle" aria-pressed="false">战斗</button>
        </div>
      </div>

      <div class="control-group" id="cropControls" hidden>
        <span class="control-label">战斗主体处理</span>
        <div class="segmented">
          <button type="button" data-crop="runtime" aria-pressed="false">旧版拉伸</button>
          <button type="button" data-crop="crop" aria-pressed="false">建议居中裁切</button>
          <button type="button" data-crop="candidate" aria-pressed="true">v0.3.3 明亮护盾</button>
        </div>
      </div>

      <span class="meta" id="sceneMeta">4+1 商品 · 5 战斗位 · 5 手牌</span>
    </section>

    <section class="viewer">
      <img
        id="sceneImage"
        src="scenes/shop-pressure-1920x1080.png"
        alt="明亮绘本商店场景压力测试"
      >
    </section>

    <section class="result-row" aria-label="检查结果">
      <div class="result">
        <span id="resultLabel1">费用与数值</span>
        <strong id="resultValue1" class="pass">通过：两种卡尺寸均可读</strong>
      </div>
      <div class="result">
        <span id="resultLabel2">主体与背景</span>
        <strong id="resultValue2" class="pass">通过：纸色面板分隔明确</strong>
      </div>
      <div class="result">
        <span id="resultLabel3">场景结论</span>
        <strong id="resultValue3" class="pass">商店布局可进入冻结候选</strong>
      </div>
    </section>

    <p class="caption" id="caption">
      商店使用代码中的真实容量：4 名随从、1 张法术、5 个战斗位和 5 张手牌。
    </p>
  </main>

  <script>
    const state = { scene: "shop", crop: "candidate" };
    const $ = id => document.getElementById(id);

    const CONTENT = {
      shop: {
        src: "scenes/shop-pressure-1920x1080.png",
        alt: "明亮绘本商店场景压力测试",
        meta: "4+1 商品 · 5 战斗位 · 5 手牌",
        labels: ["费用与数值", "主体与背景", "场景结论"],
        values: [
          "通过：两种卡尺寸均可读",
          "通过：纸色面板分隔明确",
          "商店布局可进入冻结候选"
        ],
        statuses: ["pass", "pass", "pass"],
        caption: "商店使用代码中的真实容量：4 名随从、1 张法术、5 个战斗位和 5 张手牌。"
      },
      battleRuntime: {
        src: "scenes/battle-pressure-runtime-stretch-1920x1080.png",
        alt: "当前 Runtime 强制拉伸的战斗场景压力测试",
        meta: "5 vs 5 · Runtime 强制拉伸",
        labels: ["攻击与生命", "主体比例", "护盾状态"],
        values: [
          "通过：小尺寸数值可读",
          "风险：宽幅原画被纵向拉伸",
          "风险：护盾覆盖使主体过暗"
        ],
        statuses: ["pass", "warn", "warn"],
        caption: "当前 BattleStandeeView 使用 preserveAspect=false；4:3 原画会被压入 120×192 的竖向区域。"
      },
      battleCrop: {
        src: "scenes/battle-pressure-center-crop-1920x1080.png",
        alt: "采用居中裁切的战斗场景压力测试",
        meta: "5 vs 5 · 建议居中裁切",
        labels: ["攻击与生命", "主体比例", "护盾状态"],
        values: [
          "通过：小尺寸数值可读",
          "通过：角色比例更自然",
          "风险：护盾覆盖仍然过暗"
        ],
        statuses: ["pass", "pass", "warn"],
        caption: "居中裁切保留了主体比例；进入 v0.3.3 前仍需单独校准护盾覆盖的亮度与混合方式。"
      },
      battleCandidate: {
        src: "scenes/battle-pressure-v0.3.3-candidate-1920x1080.png",
        alt: "采用居中裁切与明亮护盾的战斗场景压力测试",
        meta: "5 vs 5 · v0.3.3 明亮候选",
        labels: ["攻击与生命", "主体比例", "护盾状态"],
        values: [
          "通过：小尺寸数值可读",
          "通过：居中裁切保持比例",
          "通过：护盾清晰且不再压暗主体"
        ],
        statuses: ["pass", "pass", "pass"],
        caption: "v0.3.3 候选已同时采用居中覆盖裁切和明亮边缘式护盾；等待 Unity 环境中的最终材质与 Prefab 验收。"
      }
    };

    function currentContent() {
      if (state.scene === "shop") return CONTENT.shop;
      if (state.crop === "runtime") return CONTENT.battleRuntime;
      if (state.crop === "crop") return CONTENT.battleCrop;
      return CONTENT.battleCandidate;
    }

    function render() {
      const content = currentContent();
      $("sceneImage").src = content.src;
      $("sceneImage").alt = content.alt;
      $("sceneMeta").textContent = content.meta;
      $("caption").textContent = content.caption;
      for (let index = 0; index < 3; index += 1) {
        const label = $(`resultLabel${index + 1}`);
        const value = $(`resultValue${index + 1}`);
        label.textContent = content.labels[index];
        value.textContent = content.values[index];
        value.className = content.statuses[index];
      }
      $("cropControls").hidden = state.scene !== "battle";
    }

    $("sceneControls").addEventListener("click", event => {
      const button = event.target.closest("button[data-scene]");
      if (!button) return;
      state.scene = button.dataset.scene;
      $("sceneControls").querySelectorAll("button").forEach(candidate => {
        candidate.setAttribute("aria-pressed", String(candidate === button));
      });
      render();
    });

    $("cropControls").addEventListener("click", event => {
      const button = event.target.closest("button[data-crop]");
      if (!button) return;
      state.crop = button.dataset.crop;
      $("cropControls").querySelectorAll("button").forEach(candidate => {
        candidate.setAttribute("aria-pressed", String(candidate === button));
      });
      render();
    });
  </script>
</body>
</html>
